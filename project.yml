name: QuickBlade
options:
  bundleIdPrefix: com.quickblade
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

# DEVELOPMENT_TEAM is set in Signing.xcconfig, which optionally includes an
# untracked Local.xcconfig — see the comments in Signing.xcconfig. Keeping the
# Team ID out of this file stops the repo identifying one Apple account.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: "Automatic"
    ENABLE_HARDENED_RUNTIME: YES

targets:

  QuickBlade:
    type: application
    platform: macOS
    sources:
      - path: QuickBlade
        excludes:
          - "AppIcon.icon"
      - path: QuickBlade/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: QuickBlade/QuickBlade.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.quickblade.QuickBlade
        PRODUCT_NAME: "Quick Blade"
        INFOPLIST_KEY_CFBundleDisplayName: "Quick Blade"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
    dependencies:
      - target: BladeQuickLook
        embed: true
      - target: BladeThumbnail
        embed: true

  BladeQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: BladeQuickLook
        excludes:
          - "Info.plist"
          - "BladeQuickLook.entitlements"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: BladeQuickLook/BladeQuickLook.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.quickblade.QuickBlade.BladeQuickLook
        PRODUCT_NAME: BladeQuickLook
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BladeQuickLook/Info.plist
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_VERSION: "5.0"

  BladeThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: BladeThumbnail
        excludes:
          - "Info.plist"
          - "BladeThumbnail.entitlements"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: BladeThumbnail/BladeThumbnail.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.quickblade.QuickBlade.BladeThumbnail
        PRODUCT_NAME: BladeThumbnail
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BladeThumbnail/Info.plist
        SWIFT_VERSION: "5.0"

  BladeQuickLookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: BladeQuickLook
        includes:
          - "TemplateResolver.swift"
          - "BladeTranspiler.swift"
          - "DefaultStylesheet.swift"
          - "FakeData.swift"
          - "DiagnosticsStrip.swift"
      - path: BladeThumbnail
        includes:
          - "ThumbnailProvider.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quickblade.BladeQuickLookTests
        SWIFT_VERSION: "5.0"

schemes:
  BladeQuickLookTests:
    build:
      targets:
        BladeQuickLookTests: all
    test:
      targets:
        - BladeQuickLookTests
